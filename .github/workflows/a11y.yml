name: a11y

# T-I-10: @axe-core/playwright で主要 8 画面の WCAG 2.2 AA 違反を 0 件に保つ。
# main への push 時のみ実行 (PR ごとに走らせると CI 時間が長い)。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

permissions:
  contents: read
  pull-requests: write

jobs:
  axe:
    name: axe-core (全 39 route)
    runs-on: ubuntu-latest
    # Gate #15 と同じ実サービス構成で監査する (API/DB 無しだと画面がエラー状態に
    # なり、実ユーザーが見る UI の a11y を測れない)。手順は Gate #15 の実証済み
    # ステップを踏襲 (2026-08-15 GAP-112 完了時に整備)。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      ATELIER_AUTH_JWT_SECRET: local-human-qa-secret-at-least-32-characters-long
      ATELIER_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:54322/postgres
      ATELIER_CORS_EXTRA_ORIGINS: http://localhost:3000
      ATELIER_EMAIL_DRY_RUN: "1"
      ATELIER_ALLOW_FAKE_LLM: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "9.12.0" }
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.7" }
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with: { version: "0.11.16" }
      - name: Provision DB (bootstrap + migrations + seeds + E2E seed)
        run: |
          PGURL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/ci/pg-bootstrap.sql
          PGURL="$PGURL" bash scripts/ci/apply-migrations.sh
          PGURL="$PGURL" bash scripts/ci/apply-seeds.sh
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/ci/e2e-seed.sql
      - name: Start API (background)
        run: |
          uv sync --all-packages --all-extras
          export ATELIER_BYOK_ENCRYPTION_KEY="$(uv run python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')"
          export ATELIER_VAULT_ENCRYPTION_KEY="$ATELIER_BYOK_ENCRYPTION_KEY"
          (cd apps/api && nohup uv run uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && { echo "api up"; exit 0; }
            sleep 2
          done
          echo "::error::API did not become healthy"; tail -50 /tmp/api.log; exit 1
      - name: Install Playwright browsers
        run: pnpm -F @atelier/e2e exec playwright install --with-deps chromium
      - name: Build apps/web
        run: pnpm -F @atelier/web build
      - name: Start web server in background
        # 注意: "pnpm start -- -p 3000" は next start に "--" が渡り
        # 「-p というディレクトリが無い」で即死する (2026-08-15 実走で検出)。
        # start script が -p 3000 を含むため引数追加は不要。
        run: |
          (cd apps/web && nohup npx next start -p 3000 > /tmp/web.log 2>&1 &)
      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then
              echo "Ready"; exit 0
            fi
            sleep 1
          done
          echo "Server did not start"; tail -50 /tmp/web.log; exit 1
      - name: Run axe a11y spec
        run: pnpm -F @atelier/e2e exec playwright test tests/a11y.spec.ts --project=chromium-desktop --reporter=list
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
