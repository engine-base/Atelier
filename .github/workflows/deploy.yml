# Atelier — Production Deploy (T-F-06)
#
# トリガー:
#   - push to main: Fly.io production deploy
#   - workflow_dispatch: 手動 trigger 可
#
# Vercel deploy は Vercel GitHub Integration が自動実行する (vercel.json を
# 認識して preview / production を仕分け)。本 workflow は Fly.io 専用。
#
# 必要な GitHub Secrets:
#   - FLY_API_TOKEN / FLY_APP_NAME
#   - PROD_DATABASE_URL (**必須**): 本番 DB へ schema migration を自動適用する。
#     deploy 前に SCHEMA_ONLY=1 で冪等適用し、スキーマドリフト (INFRA-3) を防ぐ。
#     GAP-192: 未設定なら **deploy を止める**。従来は黙って skip していたため
#     「新しいコードを古いスキーマの本番へ流す」事故を CI が素通ししていた。
#     スキーマ変更が無い緊急 deploy のみ skip_migrations=true で明示的に抜ける。
#
# v3-gate.yml が PASS している前提 (deploy は merge 後にのみ動く)。

name: deploy

on:
  # 本番反映は手動 (workflow_dispatch) のみ — 経営者判断 (2026-08-13):
  # 本番公開はまだ行わない。main 追随 (CI 有効化) と本番リリースを切り離すため
  # push トリガーを無効化した。公開を始めるとき (T-I-24 go/no-go 承認後) に
  # 下の push トリガーを復活させる:
  #   push:
  #     branches: [main]
  #     paths: ["apps/api/**", "fly.toml", ".github/workflows/deploy.yml"]
  # 初回 deploy は workflow_dispatch で実機検証済 (https://atelier-api-eb.fly.dev/health 200 OK)。
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先 (production | staging)。staging は ADR-021 — 本番と同じ手順で別インスタンスへ (GAP-246)"
        required: false
        type: choice
        options: [production, staging]
        default: production
      app:
        description: "Fly.io app to deploy"
        required: false
        default: ""
      skip_migrations:
        description: "migration を skip する (スキーマ変更が無い緊急 deploy のみ)"
        required: false
        type: boolean
        default: false
      server_ai:
        description: "意味検索・文字起こしをサーバーで動かす (既定 on。off にするとキーワード検索に落ちる)"
        required: false
        type: choice
        options: ["", "true", "false"]
        default: ""

# concurrency: 同一ブランチで重複 deploy を抑止する。
concurrency:
  group: deploy-fly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  fly:
    name: "Fly.io (${{ inputs.environment || 'production' }})"
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # ADR-021: environment=staging なら STAGING_* の secrets を使う (手順は同じ = 本番と同じコードで作る)
      # 注意: `cond && A || B` は A が空だと B (= 本番) に落ちる。staging の secrets 未登録で本番へ流れる事故を
      # 防ぐため、staging 用は別の env に取り、Verify で「staging なのに空」を fail にする (下)。
      FLY_APP_NAME: ${{ inputs.app || (inputs.environment == 'staging' && secrets.STAGING_FLY_APP_NAME || secrets.FLY_APP_NAME) }}
      PROD_DATABASE_URL: ${{ inputs.environment == 'staging' && secrets.STAGING_DATABASE_URL || secrets.PROD_DATABASE_URL }}
      STAGING_FLY_APP_NAME: ${{ secrets.STAGING_FLY_APP_NAME }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
      SKIP_MIGRATIONS: ${{ inputs.skip_migrations }}
    steps:
      - uses: actions/checkout@v4
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify required secrets
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "staging" ]; then
            # staging の secrets が無いと上の式は本番の値に落ちる。ここで止める (本番へ誤デプロイしない)
            if [ -z "$STAGING_FLY_APP_NAME" ] || [ -z "$STAGING_DATABASE_URL" ]; then
              echo "::error::environment=staging but STAGING_FLY_APP_NAME / STAGING_DATABASE_URL are not set (scripts/staging-bootstrap.sh を先に実行)"
              exit 1
            fi
            if [ -z "${{ inputs.app }}" ] && [ "$FLY_APP_NAME" != "$STAGING_FLY_APP_NAME" ]; then
              echo "::error::environment=staging resolved to app=$FLY_APP_NAME (not staging). refusing"
              exit 1
            fi
          fi
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "$FLY_APP_NAME" ]; then
            echo "::error::FLY_APP_NAME secret is not set"
            exit 1
          fi
      - name: Verify runtime secrets on Fly (G-11)
        # GAP-278 (通し J31-07 / J39-01): 本番に Vault 鍵が無く、シークレット登録が全員 500 だった。
        # 「外部リソースの実在」はダッシュボードの目視でなくデプロイの関所で確かめる。
        # 名前だけを見る (値は取らない・出さない)。
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          # 表形式の 1 列目 = secret 名 (flyctl の版に依存しない。値は一切出力されない)
          names="$(flyctl secrets list -a "$FLY_APP_NAME" | awk 'NR>1 {print $1}')"
          echo "secrets present: $(printf '%s' "$names" | wc -l | tr -d ' ') names"
          missing=""
          has() { printf '%s\n' "$names" | grep -qx "$1"; }
          has ATELIER_VAULT_ENCRYPTION_KEYS || has ATELIER_VAULT_ENCRYPTION_KEY || missing="$missing ATELIER_VAULT_ENCRYPTION_KEYS"
          for n in ATELIER_AUTH_JWT_SECRET ATELIER_DB_URL ATELIER_SUPABASE_ADMIN_API_URL ATELIER_SUPABASE_SERVICE_ROLE_KEY; do
            has "$n" || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Fly app $FLY_APP_NAME is missing runtime secrets:$missing (flyctl secrets set <NAME>=... -a $FLY_APP_NAME)"
            exit 1
          fi
          echo "runtime secrets present on $FLY_APP_NAME"
          # GAP-192: PROD_DATABASE_URL 未設定は **黙って skip させない**。
          # 従来は migration ステップが if で静かに飛ばされるだけだったので、
          # 「新しいコードを古いスキーマの本番へ流す」= 起動後に 500 になる事故を
          # CI が素通ししていた (ローカルで直した GAP-172 と同じ穴が本番に残っていた)。
          # スキーマ変更を伴わない緊急 deploy だけ skip_migrations=true で明示的に抜ける。
          if [ -z "$PROD_DATABASE_URL" ] && [ "$SKIP_MIGRATIONS" != "true" ]; then
            echo "::error::PROD_DATABASE_URL secret is not set."
            echo "::error::設定するまで deploy しません (古いスキーマの本番へ新しいコードを流さないため)。"
            echo "::error::スキーマ変更が無い緊急 deploy のみ skip_migrations=true で実行してください。"
            exit 1
          fi
          if [ "$SKIP_MIGRATIONS" = "true" ]; then
            echo "::warning::migration を明示的に skip しています。スキーマ変更を含む deploy では使わないでください。"
          fi
          echo "::notice::deploying to environment=$DEPLOY_ENVIRONMENT app=$FLY_APP_NAME"
      # INFRA-3 恒久対策: 本番 DB スキーマを deploy 前に同期する。
      # スキーマ用 migration は冪等 (if not exists / drop policy if exists) なので
      # 部分適用済みの本番へ再適用しても安全。@verification-only (RLS 越境試験の
      # fixture) は SCHEMA_ONLY=1 で skip し本番を汚さない。
      - name: Apply DB migrations (schema-only)
        if: ${{ inputs.skip_migrations != true }}
        env:
          PGURL: ${{ env.PROD_DATABASE_URL }}
          SCHEMA_ONLY: "1"
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          bash scripts/ci/apply-migrations.sh
      # 運営固定シード (AI 社員テンプレ / skill / 法令ページ) を投入する。全て UPSERT で
      # 再実行安全。これが無いと新規 workspace の AI 社員自動シード (t-d-99) が
      # テンプレ 0 件で空振りする (ギャップ #27)。
      - name: Apply DB seeds
        if: ${{ inputs.skip_migrations != true }}
        env:
          PGURL: ${{ env.PROD_DATABASE_URL }}
        run: bash scripts/ci/apply-seeds.sh
      # GAP-200: サーバー実行を選んだら、VM が足りているかを **deploy 前に** 確かめる。
      # メモリ不足のまま入れると OOM で落ちるだけで、原因が分からない。
      # GAP-285: 既定を on にした。push での自動 deploy にも効かせるため、
      # workflow_dispatch の入力が空なら on とみなす (明示的に "false" のときだけ off)。
      - name: Resolve server-side AI setting
        id: server_ai
        env:
          INPUT: ${{ inputs.server_ai }}
        run: |
          VALUE="true"
          if [ "$INPUT" = "false" ]; then VALUE="false"; fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "::notice::意味検索・文字起こしをサーバーで動かす = $VALUE"
      - name: Verify VM size for server-side AI
        if: ${{ steps.server_ai.outputs.value == 'true' }}
        env:
          SERVER_AI_MIN_MB: "1024"
        run: |
          MEM=$(grep -A5 '^\[\[vm\]\]' fly.toml | grep 'memory' | head -1 | sed 's/[^0-9]*\([0-9]*\).*/\1/')
          UNIT=$(grep -A5 '^\[\[vm\]\]' fly.toml | grep 'memory' | head -1 | grep -o 'gb\|mb')
          if [ "$UNIT" = "gb" ]; then MEM=$((MEM * 1024)); fi
          echo "::notice::fly.toml の memory = ${MEM}MB"
          if [ "${MEM:-0}" -lt "$SERVER_AI_MIN_MB" ]; then
            echo "::error::server_ai=true ですが fly.toml の memory が ${MEM}MB です。"
            echo "::error::意味検索・文字起こしをサーバーで動かすには 1024MB 以上 (推奨 2048MB) が要ります。"
            echo "::error::実測: 埋め込み 652MB〜1,554MB / whisper 302MB〜1,007MB。"
            echo "::error::fly.toml の [[vm]] memory を上げてから再実行してください (月額も上がります)。"
            exit 1
          fi
      - name: Deploy
        env:
          SERVER_AI: ${{ steps.server_ai.outputs.value }}
        run: |
          # GAP-285: 既定は 1 (意味検索は宣伝している機能なので本番に同梱する)。
          # off にすると画面は「意味検索は使えません」と正直に出し、
          # キーワード検索へ落ちる (GAP-285 ②)。
          LOCALRAG=1
          if [ "$SERVER_AI" = "false" ]; then
            LOCALRAG=0
            echo "::warning::意味検索・文字起こしをサーバーに入れずにビルドします (キーワード検索に落ちます)"
          else
            echo "::notice::意味検索・文字起こしをサーバー同梱でビルドします (イメージ +約 2.6GB)"
          fi
          flyctl deploy \
            --app "$FLY_APP_NAME" \
            --remote-only \
            --build-arg "INSTALL_LOCALRAG=$LOCALRAG" \
            --strategy rolling \
            --wait-timeout 300
      - name: Smoke test /health
        run: |
          sleep 5
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://${FLY_APP_NAME}.fly.dev/health" || echo "000")
          if [ "$status" != "200" ]; then
            echo "::error::Fly.io /health returned $status (expected 200)"
            exit 1
          fi
          echo "::notice::Fly.io /health OK (200)"
      # GAP-285 (G-11: 外部リソースの実在): 「入れたつもりで入っていない」を、
      # 本番で最初のユーザーが踏む前にここで落とす。意味検索が unavailable のまま
      # 出ていくと、画面には「使えません」としか出ず、原因が誰にも分からない。
      - name: Verify server-side AI is actually present
        if: ${{ steps.server_ai.outputs.value == 'true' }}
        run: |
          body=$(curl -s --max-time 30 "https://${FLY_APP_NAME}.fly.dev/health/capabilities" || echo "")
          echo "capabilities: $body"
          case "$body" in
            *'"embeddings":true'*) ;;
            *)
              echo "::error::意味検索の部品 (fastembed) が本番イメージに入っていません。"
              echo "::error::INSTALL_LOCALRAG=1 でビルドされたか、Dockerfile の prefetch が失敗していないか確認してください。"
              exit 1
              ;;
          esac
          case "$body" in
            *'"transcription":true'*) ;;
            *) echo "::warning::文字起こしの部品 (faster-whisper) が入っていません (議事録の自動文字起こしは使えません)" ;;
          esac
          echo "::notice::意味検索・文字起こしの部品が本番に入っていることを確認しました"
