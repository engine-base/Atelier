# Atelier API — Fly.io configuration (T-F-06)
#
# 紐付けるアプリ: atelier-api-eb (engine-base 個人 org)
# 東京リージョン (NRT) で常駐、auto-stop で idle 時自動停止 → 開発期コスト ~$0/月
# Production URL: https://atelier-api-eb.fly.dev
#
# selected-stack.json#api_hosting = "Fly.io (NRT)"
# 関連: apps/api/src/health.py の /health endpoint を healthcheck に使う

app = "atelier-api-eb"
primary_region = "nrt"
kill_signal = "SIGINT"
kill_timeout = "30s"

# ─────────────────────────────────────────────────────────
# Build — apps/api/Dockerfile (uv ベースの multi-stage build)
# (旧 Paketo CNB は remote build で unauthorized エラーになるため Dockerfile に変更)
# ─────────────────────────────────────────────────────────
[build]
  dockerfile = "apps/api/Dockerfile"

# ─────────────────────────────────────────────────────────
# Environment — non-secret env vars (secrets は flyctl secrets で投入済)
# ─────────────────────────────────────────────────────────
[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  APP_ENV = "production"
  LOG_LEVEL = "info"

# ─────────────────────────────────────────────────────────
# HTTP service — port 8000 で uvicorn 起動
# ─────────────────────────────────────────────────────────
[http_service]
  internal_port = 8000
  force_https = true
  # 暴走防止 + コスト最小化:
  #   - auto_stop_machines = "stop" : 5 分 idle で machine 完全停止 (課金 $0)
  #   - auto_start_machines = true   : request 到達時に自動起動 (cold start 1-3 秒)
  #   - min_machines_running = 0     : 完全停止可 (開発期は常に 0)
  #   - max_machines_running = 2     : 想定外の暴走でも最大 2 台に制限
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 2
  processes = ["app"]

  # GAP-198/201/202: SSE (チャット) は張っている間ずっと 1 リクエストとして数える。
  #   GAP-201: 待っている間は DB 接続を手放すようにした
  #   GAP-202: 待っている間のポーリング (0.25 秒ごと 3 クエリ) 自体をやめ、
  #            書き込まれた瞬間に DB から通知が来る形にした
  # 実測 (.qa/gap-202): 同時 1000 人待機でメモリ +2.5MB / 通知の配達 p95 20ms /
  # 待機中の DB 接続 0 本。10000 人で配達 p95 505ms になり、そこが崩れ始め。
  # アプリ側の実上限 1000 に合わせる。hard_limit は普通の API 呼び出しごと
  # 弾かないよう倍の余裕を残す (SSE の打ち切りはアプリが 503 + 日本語で返す)。
  [http_service.concurrency]
    type = "requests"
    soft_limit = 1000
    hard_limit = 2000

# ─────────────────────────────────────────────────────────
# Healthcheck — apps/api/src/health.py の /health を 30 秒間隔で叩く
# ─────────────────────────────────────────────────────────
[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "get"
  timeout = "5s"
  path = "/health"
  protocol = "http"

# ─────────────────────────────────────────────────────────
# Processes — app (uvicorn) のみ。Inngest worker は内蔵 (T-F-13)
# ─────────────────────────────────────────────────────────
[processes]
  app = "uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --workers 1"

# ─────────────────────────────────────────────────────────
# VM
#
# GAP-285 (通し J35-01 / J35-07): 本番に埋め込みプロバイダが無く、意味検索が
# ずっと unavailable だった。**意味検索は宣伝している機能**なので、
# 「使えないと正直に出す」(GAP-285 ②) で終わらせず、本番に同梱する (①) と決めた。
#
# サイズは実測から決める (推測しない):
#   埋め込み (fastembed / multilingual-e5-large ONNX) 652MB〜1,554MB
#   文字起こし (faster-whisper)                        302MB〜1,007MB
# 上振れ側 1,554MB が入りきるのは 2GB。1GB は「ふだんは動くが、
# 長い文章が来た日に OOM で落ちる」= 一番たちの悪い壊れ方になるので選ばない。
# 費用は上がる (shared-cpu-1x 2GB)。埋め込みを載せない運用に戻すなら、
# deploy の server_ai を false にしたうえでここを 256mb に戻す。
# ─────────────────────────────────────────────────────────
[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"
  cpus = 1
