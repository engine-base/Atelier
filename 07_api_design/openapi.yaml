          type: array
          items: { type: string, enum: [html, json, md] }
          description: 実在する形式のみ (創作しない)
        summary: { type: string, nullable: true }

    ClientMockItem:
      type: object
      description: クライアント向けモック — screen_name 毎の最新版 (GAP-029)。
      required: [id, screen_name, version, updated_at]
      properties:
        id: { type: string, format: uuid }
        screen_name: { type: string }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    ClientMocksResponse:
      type: object
      required: [items, total_screens]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ClientMockItem' }
        total_screens: { type: integer }

    ClientCommentCreate:
      type: object
      description: クライアントのコメント投稿 (comment スコープ必須 — GAP-029)。
      required: [target_type, target_id, content]
      properties:
        target_type: { type: string, enum: [workflow_output, mock] }
        target_id: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 4000 }

    ClientCommentItem:
      type: object
      description: クライアント自身のコメント + 運営からの返信 (GAP-029)。
      required: [id, target_type, target_id, content, is_client_author, created_at]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        target_label: { type: string, nullable: true }
        content: { type: string }
        author_name: { type: string, nullable: true }
        is_client_author: { type: boolean }
        created_at: { type: string, format: date-time }

paths:
  # ==========================================================================
  # auth (T-A-01〜05: signup / signin / Magic Link / リセット / 退会)
  # ==========================================================================
  /auth/signup:
    post:
      tags: [auth]
      summary: ユーザー登録 + 同意取得（F-001 / F-LEGAL-004）
      x-implementation-path: apps/api/src/routes/auth/__init__.py::signup
      x-screen-ids: [S-A01]
      x-feature-ids: [F-001, F-LEGAL-004]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: 登録成功（JWT は含まない、signin で発行）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SignupResponse' }
        '409': { description: email 重複, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: バリデーション失敗 / 必須 consent 不足, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ==========================================================================
  # impact (F-IMP01 影響範囲解析 / NetworkX)
  # ==========================================================================
  /impact/tasks/{task_id}:
    get:
      tags: [impact]
      summary: タスク影響範囲解析（下流 task 群 / read-only）
      x-implementation-path: apps/api/src/routes/impact/__init__.py::analyze_task_impact
      x-screen-ids: []
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 解析結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImpactAnalysisResponse' }
        '404': { description: 不在 or 不可視, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ==========================================================================
  # public (法令ページ + データ削除請求 / 未認証アクセス可)
  # ==========================================================================
  /public/legal-documents:
    get:
      tags: [public]
      summary: 法令ページ一覧（公開・未認証可）
      x-implementation-path: apps/api/src/routes/public/__init__.py::list_legal_documents
      x-screen-ids: [S-PUB01, S-PUB02, S-PUB03]
      parameters:
        - { name: locale, in: query, schema: { type: string } }
      responses:
        '200':
          description: 一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LegalDocument' } }

  /public/legal-documents/{doc_type}:
    get:
      tags: [public]
      summary: 法令ページ取得（公開・未認証可）
      x-implementation-path: apps/api/src/routes/public/__init__.py::get_legal_document
      x-screen-ids: [S-PUB01, S-PUB02, S-PUB03]
      parameters:
        - { name: doc_type, in: path, required: true, schema: { type: string, enum: [terms_of_service, privacy_policy, tokushoho] } }
        - { name: locale, in: query, schema: { type: string, default: ja } }
      responses:
        '200':
          description: 取得
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LegalDocument' }
        '404': { description: 不在, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /public/data-deletion-requests:
    post:
      tags: [public]
      summary: データ削除請求（本人・要認証 / F-LEGAL-002）
      x-implementation-path: apps/api/src/routes/public/__init__.py::create_data_deletion_request
      x-screen-ids: [S-PUB04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: 受付
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DataDeletionRequestResponse' }
        '401': { description: 未認証, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /public/bridge-latest:
    get:
      tags: [public]
      summary: Bridge 最新版情報（公開・未認証可 / GAP-135 更新チェック）
      x-implementation-path: apps/api/src/routes/public/__init__.py::get_bridge_latest
      x-screen-ids: []
      responses:
        '200':
          description: 最新版とダウンロード URL（未設定の OS キーは省略）
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [version]
                    properties:
                      version: { type: string }
                      download_urls:
                        type: object
                        properties:
                          mac: { type: string }
                          win: { type: string }
                          linux: { type: string }

  # ==========================================================================
  # auth (11 endpoints)
  # ==========================================================================
  /auth/signin:
    post:
      tags: [auth]
      summary: ログイン + 5 回失敗ロック (F-001)
      security: []
      x-implementation-path: apps/api/src/routes/auth/__init__.py::signin
      x-screen-ids: [S-A01]
      x-rate-limit: 5/min/ip
      x-feature-ids: [F-001]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SigninRequest' }
      responses:
        '200':
          description: サインイン成功 (HS256 JWT 発行)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SigninResponse' }
        '401':
          description: 認証情報不正
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 5 回失敗で一時ロック or レート上限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/magic-link/request:
    post:
      tags: [auth]
      summary: Magic Link 送信要求 (常に 202 / enumeration 防止)
      security: []
      x-implementation-path: apps/api/src/routes/auth/__init__.py::magic_link_request
      x-screen-ids: [S-A01]
      x-feature-ids: [F-001]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MagicLinkRequest' }
      responses:
        '202':
          description: 受付 (email 存在に依らず 202)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MagicLinkAccepted' }

  /auth/magic-link/verify:
    post:
      tags: [auth]
      summary: Magic Link 検証 → JWT 発行 (refresh token 同時)
      security: []
      x-implementation-path: apps/api/src/routes/auth/__init__.py::magic_link_verify
      x-screen-ids: [S-A01]
      x-feature-ids: [F-001]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MagicLinkVerifyRequest' }
      responses:
        '200':
          description: 成功 (SigninResponse)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SigninResponse' }
        '401':
          description: token 無効 / 期限切れ / 既消費
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/oauth/{provider}/redirect-url:
    get:
      tags: [auth]
      summary: OAuth Provider 認可 URL 取得 (CSRF state 含む)
      security: []
      x-implementation-path: apps/api/src/routes/auth/__init__.py::oauth_redirect
      x-screen-ids: [S-A01]
      x-feature-ids: [F-001]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, github] } }
      responses:
        '200':
          description: 認可 URL + state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OAuthRedirectResponse' }
        '422':
          description: provider 不正
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/oauth/providers:
    get:
      tags: [auth]
      summary: 有効な OAuth プロバイダ一覧 (env 未設定は載せない = 死にボタン禁止 / GAP-020)
      security: []
      x-implementation-path: apps/api/src/routes/auth/__init__.py::oauth_providers
      x-screen-ids: [S-A01]
      x-feature-ids: [F-001]
      responses:
        '200':
          description: 有効プロバイダ (両方未設定なら空配列)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, enum: [google, github] }
                        display_name: { type: string }

  /auth/oauth/{provider}/start:
    get:
      tags: [auth]
      summary: OAuth 認可フロー開始 (302 でプロバイダ認可 URL へ / GAP-020)
      security: []
      x-implementation-path: apps/api/src/routes/auth/__init__.py::oauth_start
      x-screen-ids: [S-A01]
      x-feature-ids: [F-001]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, github] } }
      responses:
        '302':
          description: プロバイダ認可 URL へ redirect (client_id / redirect_uri / HS256 署名 state 10 分)
        '422': { description: provider が enum 外, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: プロバイダ env 未設定 (偽装しない), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      summary: OAuth コールバック (code 交換 → 連付け → JWT → web へ 302 / GAP-020)
      security: []
      x-implementation-path: apps/api/src/routes/auth/__init__.py::oauth_callback
      x-screen-ids: [S-A01]
      x-feature-ids: [F-001]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, github] } }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '302':
          description: 成功 = /auth/oauth-complete へ (フラグメントで access_token/expires_at)。プロバイダ拒否・交換失敗・退会済は ?error= で誠実 redirect
        '400': { description: code/state 欠落・state 改竄/期限切れ/provider 不一致・email 未検証 (偽アカウントを作らない), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: provider が enum 外, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: プロバイダ env 未設定, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }


  /auth/password-reset/request:
    post:
      tags: [auth]
      summary: パスワードリセット要求 (常に 202)
      security: []
      x-implementation-path: apps/api/src/routes/auth/__init__.py::password_reset_request
      x-screen-ids: [S-A01]
      x-feature-ids: [F-001]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: 受付
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PasswordResetAccepted' }

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: パスワードリセット確定 (旧 refresh token 一括失効)
      security: []
      x-implementation-path: apps/api/src/routes/auth/__init__.py::password_reset_confirm
      x-screen-ids: [S-A01]
      x-feature-ids: [F-001]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PasswordResetConfirmResponse' }
        '401':
          description: token 不正 / 期限切れ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: access_token 再発行 (refresh token rotate)
      security: []
      x-implementation-path: apps/api/src/routes/auth/__init__.py::auth_refresh
      x-feature-ids: [F-001]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: rotate 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RefreshResponse' }
        '401':
          description: refresh token 不正 / 期限切れ / 失効済
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/account/delete:
    post:
      tags: [auth]
      summary: 退会 (30 日猶予で soft-delete, F-LEGAL-002)
      x-implementation-path: apps/api/src/routes/auth/__init__.py::account_delete
      x-screen-ids: [S-A03]
      x-feature-ids: [F-001, F-LEGAL-002]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountDeleteRequest' }
      responses:
        '200':
          description: 退会受付 (30 日後にハード削除予定)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AccountDeleteResponse' }
        '401':
          description: password 不一致 or 未認証
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 既に退会済 / 削除不能
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/account/restore:
    post:
      tags: [auth]
      summary: 退会キャンセル (30 日猶予期間中の復活)
      security: []
      x-implementation-path: apps/api/src/routes/auth/__init__.py::account_restore
      x-screen-ids: [S-A03]
      x-feature-ids: [F-001, F-LEGAL-002]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRestoreRequest' }
      responses:
        '200':
          description: 復活成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AccountRestoreResponse' }
        '401':
          description: password 不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 退会記録なし
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: 30 日猶予期間切れ (ハード削除予定 / 既削除)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ==========================================================================
  # contract (T-A-45 API 契約凍結 + screen coverage 検証)
  # ==========================================================================
  /contract/screen-coverage:
    get:
      tags: [contract]
      summary: screen × OpenAPI カバレッジレポート (Gate #9 と同条件)
      x-implementation-path: apps/api/src/routes/contract/__init__.py::screen_coverage
      x-screen-ids: [S-T05]
      responses:
        '200':
          description: カバレッジ詳細
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ScreenCoverageReport' }
        '401':
          description: 未認証
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /contract/freeze-status:
    get:
      tags: [contract]
      summary: API 契約凍結状態
      x-implementation-path: apps/api/src/routes/contract/__init__.py::freeze_status
      x-screen-ids: [S-T05]
      responses:
        '200':
          description: 状態
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FreezeStatus' }
        '401':
          description: 未認証
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /contract/freeze:
    post:
      tags: [contract]
      summary: API 契約凍結 (admin, screen coverage 100% 必須)
      x-implementation-path: apps/api/src/routes/contract/__init__.py::freeze
      x-screen-ids: [S-T05]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FreezeRequest' }
      responses:
        '200':
          description: 凍結完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FreezeStatus' }
        '401':
          description: 未認証
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: admin 権限なし
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 既に凍結済
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: screen coverage 100% 未満
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /contract/unfreeze:
    post:
      tags: [contract]
      summary: API 契約凍結解除 (admin)
      x-implementation-path: apps/api/src/routes/contract/__init__.py::unfreeze
      x-screen-ids: [S-T05]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FreezeRequest' }
      responses:
        '200':
          description: 凍結解除完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FreezeStatus' }
        '401':
          description: 未認証
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: admin 権限なし
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 凍結状態にない
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me:
    get:
      tags: [users]
      summary: 自己プロフィール取得
      x-implementation-path: apps/api/src/routes/users/__init__.py::get_me
      x-screen-ids: [S-U01]
      responses:
        '200':
          description: プロフィール
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { description: 未認証, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 不在, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: [users]
      summary: 自己プロフィール更新（display_name）
      x-implementation-path: apps/api/src/routes/users/__init__.py::update_me
      x-screen-ids: [S-U01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: 更新後プロフィール
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { description: 未認証, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 不在, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: バリデーション失敗, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /search:
    get:
      tags: [search]
      summary: 横断検索（project/task/knowledge/employee）
      x-implementation-path: apps/api/src/routes/search/__init__.py::search
      x-screen-ids: [S-U02]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [all, project, task, knowledge, employee], default: all }
      responses:
        '200':
          description: 検索結果
          content:
